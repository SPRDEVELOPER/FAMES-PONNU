services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/flamesbot
    depends_on:
      - mongo
    ports:
      - "3000:3000"
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
